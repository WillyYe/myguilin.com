<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyGuilin 后台 — Site Shell</title>
  <style>
    :root { --river:#0e4d64; --gold:#c9a96e; --sand:#f4f1ea; --border:#e3ddd0; --text:#333; --text-light:#888; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--sand); color:var(--text); }
    header { background:var(--river); color:#fff; padding:14px 22px; display:flex; align-items:center; justify-content:space-between; }
    header h1 { font-size:17px; margin:0; font-weight:600; }
    header button { background:rgba(255,255,255,.15); color:#fff; border:0; padding:7px 14px; border-radius:8px; cursor:pointer; font-size:13px; }
    header button:hover { background:rgba(255,255,255,.28); }
    main { max-width:840px; margin:24px auto; padding:0 18px; }
    .card { background:#fff; border:1px solid var(--border); border-radius:12px; padding:20px 22px; margin-bottom:20px; }
    .card h2 { margin:0 0 14px; font-size:16px; color:var(--river); }
    label { display:block; font-size:12px; font-weight:600; color:var(--text-light); margin:12px 0 5px; }
    input[type=text], input[type=password], textarea { width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; }
    textarea { resize:vertical; line-height:1.5; }
    #navJson { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12.5px; min-height:300px; }
    .hint { font-size:12px; color:var(--text-light); margin-top:6px; line-height:1.6; }
    .btn { background:var(--river); color:#fff; border:0; padding:10px 20px; border-radius:9px; cursor:pointer; font-size:14px; font-weight:600; }
    .btn:hover { opacity:.92; }
    .btn-ghost { background:#fff; color:var(--river); border:1px solid var(--river); }
    .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
    .toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); background:#333; color:#fff; padding:11px 18px; border-radius:10px; font-size:13.5px; opacity:0; pointer-events:none; transition:.25s; max-width:90vw; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast.success { background:#2e7d32; }
    .toast.error { background:#c62828; }
    code { background:rgba(0,0,0,.06); padding:1px 5px; border-radius:4px; font-size:12px; }
  </style>
</head>
<body>
  <header>
    <h1>⛰ MyGuilin 后台 · Site Shell</h1>
    <button id="btnOpenSettings">⚙ 设置</button>
  </header>

  <main>
    <!-- 设置 -->
    <section class="card" id="settingsPanel" style="display:none">
      <h2>GitHub 连接设置</h2>
      <label>GitHub Token（PAT，存于本浏览器）</label>
      <input type="password" id="ghToken" placeholder="ghp_xxx 或 github_pat_xxx">
      <div class="hint">在 <a href="https://github.com/settings/tokens" target="_blank" rel="noopener">github.com/settings/tokens</a> 生成，需有本仓库 <code>Contents: read & write</code> 权限。令牌只在本地浏览器使用，不会上传。</div>

      <label>仓库（owner/repo）</label>
      <input type="text" id="ghRepo" value="WillyYe/myguilin.com">

      <label>分支</label>
      <input type="text" id="ghBranch" value="main">

      <div class="row">
        <button class="btn" id="btnSaveSettings">保存设置</button>
      </div>
    </section>

    <!-- 编辑器 -->
    <section class="card" id="editorPanel" style="display:none">
      <h2>首页 Hero</h2>
      <label>Eyebrow（小标题 / 标签行）</label>
      <input type="text" id="heroEyebrow" placeholder="Karst Landscape of China">

      <label>Title（大标题，可用 &lt;br&gt; 换行）</label>
      <textarea id="heroTitle" rows="2" placeholder="Where Mountains&lt;br&gt;&amp; Rivers Become Poetry"></textarea>

      <label>Subtitle（副标题，可用 HTML）</label>
      <textarea id="heroSubtitle" rows="4" placeholder="Discover Guilin's legendary karst peaks..."></textarea>

      <h2 style="margin-top:26px">导航栏 Nav（JSON）</h2>
      <div class="hint">每个元素含 <code>type</code>（link / mega / button）、<code>label</code>、<code>href</code>。mega 菜单结构复杂，建议复制现有内容后小改。保存前会自动校验 JSON。</div>
      <textarea id="navJson" placeholder="[]"></textarea>

      <div class="row">
        <button class="btn" id="btnSave">💾 保存并部署</button>
        <button class="btn btn-ghost" id="btnLoad">↻ 重新加载</button>
      </div>
    </section>

    <p class="hint" style="text-align:center">保存后 GitHub Actions 会自动重建站点，约 1–2 分钟生效。</p>
  </main>

  <div id="toast" class="toast"></div>

  <script src="js/common.js?v=1"></script>
  <script src="js/shell-admin.js?v=1"></script>
</body>
</html>
