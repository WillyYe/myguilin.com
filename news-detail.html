<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News — Visit Guilin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, sans-serif; color: #1a1a1a; background: #fff; line-height: 1.6; }
    .header { background: #0d283f; color: white; padding: 16px 0; position: sticky; top: 0; z-index: 100; }
    .header-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 16px; }
    .header a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; }
    .header a:hover { color: white; }
    .logo-icon { width: 36px; height: 36px; background: #b5882a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .container { max-width: 800px; margin: 0 auto; padding: 32px 24px; }
    .news-meta { display: flex; gap: 16px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    .news-date-badge { background: #0d283f; color: #fff; padding: 8px 14px; border-radius: 10px; text-align: center; min-width: 60px; }
    .news-date-badge .day { font-size: 24px; font-weight: 700; line-height: 1; }
    .news-date-badge .month { font-size: 11px; opacity: 0.8; letter-spacing: 1px; }
    .news-tag-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 34px; color: #0d283f; margin-bottom: 12px; }
    .hero-img {
      width: 100%; height: 40vh; min-height: 280px;
      object-fit: cover; border-radius: 14px; margin-bottom: 28px;
      background: linear-gradient(135deg, #2d7aa0, #1a4a6a);
      display: flex; align-items: center; justify-content: center; color: white; font-size: 18px;
    }
    .content-body { font-size: 15px; color: #444; line-height: 1.9; }
    .content-body p { margin-bottom: 18px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: #1a4a6a; text-decoration: none; font-weight: 500; margin-top: 40px; }
    .footer { text-align: center; padding: 24px; color: #999; font-size: 13px; border-top: 1px solid #eee; margin-top: 48px; }
  </style>
</head>
<body>
  <div class="header"><div class="header-inner">
    <a href="./" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:white;"><div class="logo-icon">🏔️</div><strong>Visit Guilin</strong></a>
    <a href="./">← Back to Home</a></div></div>

  <div class="container">
    <div class="news-meta" id="newsMeta"></div>
    <h1 id="titleEn"></h1>
    <div class="hero-img" id="heroImg"></div>
    <div class="content-body" id="contentBody"></div>
    <a href="./" class="back-link">← Back to Home</a>
  </div>
  <div class="footer">© 2026 Visit Guilin — myguilin.com</div>

  <script>
    fetch('data/news.json?v=20260708')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var params = new URLSearchParams(window.location.search);
        var idx = parseInt(params.get('id')) || 0;
        var item = data[idx] || data[0];

        if (item) {
          document.title = item.titleEn + ' — Visit Guilin';
          var metaHtml = '<div class="news-date-badge"><div class="day">' + item.date.day + '</div><div class="month">' + item.date.month + ' ' + item.date.year + '</div></div>';
          metaHtml += '<span class="news-tag-badge">' + item.tag.toUpperCase() + '</span>';
          document.getElementById('newsMeta').innerHTML = metaHtml;
          document.getElementById('titleEn').textContent = item.titleEn || '';
          document.getElementById('heroImg').style.backgroundImage = "url('" + (item.img||'').replace('assets/images/','assets/images/md/') + "')";
          document.getElementById('heroImg').textContent = '';
          document.getElementById('contentBody').innerHTML = item.contentEn || '';
        }
      })
      .catch(function(e) { console.error('Failed:', e); });
  </script>
</body>
</html>
