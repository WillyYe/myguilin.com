<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experience Detail — Visit Guilin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, sans-serif; color: #1a1a1a; background: #fff; line-height: 1.6; }
    .header { background: #0d283f; color: white; padding: 16px 0; position: sticky; top: 0; z-index: 100; }
    .header-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 16px; }
    .header a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; }
    .header a:hover { color: white; }
    .logo-icon { width: 36px; height: 36px; background: #b5882a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .container { max-width: 800px; margin: 0 auto; padding: 32px 24px; }
    .badge { display: inline-block; background: linear-gradient(135deg, #b5882a, #d4a843); color: white; padding: 4px 14px; border-radius: 20px; font-size: 11px; letter-spacing: 1px; font-weight: 600; margin-bottom: 20px; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 34px; color: #0d283f; margin-bottom: 8px; }
    .subtitle { font-size: 17px; color: #52b8d8; margin-bottom: 24px; line-height: 1.6; }
    .hero-img {
      width: 100%; height: 45vh; min-height: 300px; max-height: 480px;
      object-fit: cover; background: linear-gradient(135deg, #2d7aa0, #1a4a6a);
      border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; margin-bottom: 28px;
    }
    .desc-text { font-size: 15px; color: #555; line-height: 1.9; margin-bottom: 32px; }
    .full-desc { font-size: 15px; color: #444; line-height: 1.9; margin-bottom: 32px; }
    .full-desc p { margin-bottom: 16px; }
    .full-desc ul { padding-left: 20px; margin-bottom: 12px; }
    .full-desc li { margin-bottom: 6px; }
    .section-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: #0d283f; margin: 32px 0 16px; padding-bottom: 8px; border-bottom: 2px solid #e8ecf4; }
    .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .info-card { background: #f7f9fc; border-radius: 10px; padding: 14px; text-align: center; }
    .info-card .icon { font-size: 24px; margin-bottom: 6px; }
    .info-card .label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .info-card .value { font-size: 14px; font-weight: 600; color: #0d283f; margin-top: 4px; }
    .highlights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 28px; }
    .highlight-card { background: #f0f8ff; border-radius: 10px; padding: 14px 16px; font-size: 13px; color: #333; border-left: 3px solid #52b8d8; line-height: 1.6; }
    .tips-list { list-style: none; counter-reset: tips; }
    .tips-list li { counter-increment: tips; padding: 12px 0 12px 40px; position: relative; font-size: 14px; color: #555; border-bottom: 1px solid #f0f0f0; }
    .tips-list li::before { content: counter(tips); position: absolute; left: 0; top: 12px; width: 26px; height: 26px; background: #1a4a6a; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: #1a4a6a; text-decoration: none; font-weight: 500; margin-top: 40px; }
    .footer { text-align: center; padding: 24px; color: #999; font-size: 13px; border-top: 1px solid #eee; margin-top: 48px; }
    @media (max-width: 768px) { h1 { font-size: 26px; } .hero-img { height: 30vh; } }
  </style>
</head>
<body>
  <div class="header"><div class="header-inner">
    <a href="./" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:white;"><div class="logo-icon">🏔️</div><strong>Visit Guilin</strong></a>
    <a href="./">← Back to Home</a></div></div>

  <div class="container">
    <div class="badge" id="badge"></div>
    <h1 id="titleEn"></h1>
    <p class="subtitle" id="subtitleEn"></p>
    <div class="hero-img" id="heroImg"></div>
    <p class="desc-text" id="descEn"></p>

    <div class="full-desc" id="fullDescEn"></div>

    <h2 class="section-title">Quick Info</h2>
    <div class="info-grid" id="infoGrid"></div>

    <h2 class="section-title">Highlights</h2>
    <div class="highlights-grid" id="highlightsGrid"></div>

    <h2 class="section-title">Tips</h2>
    <ul class="tips-list" id="tipsList"></ul>

    <a href="./" class="back-link">← Back to Home</a>
  </div>
  <div class="footer">© 2026 Visit Guilin — myguilin.com</div>

  <script>
    fetch('data/experience.json?v=20260708')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var params = new URLSearchParams(window.location.search);
        var id = params.get('id');
        var item = data.find(function(e) { return e.id === id; }) || data[0];

        if (item) {
          document.title = item.titleEn + ' — Visit Guilin';
          document.getElementById('badge').textContent = item.badge || '';
          document.getElementById('titleEn').textContent = item.titleEn || '';
          document.getElementById('subtitleEn').textContent = item.subtitleEn || '';
          document.getElementById('heroImg').style.backgroundImage = "url('" + (item.img || '').replace('assets/images/', 'assets/images/md/') + "')";
          document.getElementById('heroImg').textContent = '';
          document.getElementById('descEn').textContent = item.descEn || '';
          document.getElementById('fullDescEn').innerHTML = item.fullDescEn || '';

          var infoHtml = '';
          (item.infoEn || []).forEach(function(info) {
            infoHtml += '<div class="info-card"><div class="icon">' + (info.icon||'') + '</div><div class="label">'+(info.label||')+'</div><div class="value">'+(info.value||')+'</div></div>';
          });
          document.getElementById('infoGrid').innerHTML = infoHtml;

          var hlHtml = '';
          (item.highlightsEn || []).forEach(function(h) {
            hlHtml += '<div class="highlight-card">' + escapeHtml(h) + '</div>';
          });
          document.getElementById('highlightsGrid').innerHTML = hlHtml;

          var tipsHtml = '';
          (item.tipsEn || []).forEach(function(t) {
            tipsHtml += '<li>' + escapeHtml(t) + '</li>';
          });
          document.getElementById('tipsList').innerHTML = tipsHtml;
        }
      })
      .catch(function(e) { console.error('Failed:', e); });

    function escapeHtml(str) {
      if (!str) return ''; var d = document.createElement('div'); d.textContent = str; return d.innerHTML;
    }
  </script>
</body>
</html>
